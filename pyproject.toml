[project]
name = "timeseries"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebastian Urzua B", email = "seb.urzua91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastparquet>=2026.9.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
timeseries = "timeseries:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
